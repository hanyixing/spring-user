# ============================================================
# 生产环境配置（profile: prod）
# - 数据库路径独立于开发环境，必须通过环境变量提供
# - AES 密钥与管理员密码必须由环境变量注入，配置文件中不保留任何明文回退
# - 关闭 SQL 控制台打印，开启 MyBatis 缓存/懒加载并配置 Hikari 连接池
# ============================================================
spring:
  datasource:
    # 生产库路径必须通过环境变量 SQLITE_DB_PATH 提供，默认指向独立数据目录（非开发目录）
    url: jdbc:sqlite:${SQLITE_DB_PATH:/var/lib/spring-user/data/user.db}
    hikari:
      pool-name: SpringUserHikariPool
      # SQLite 为单写多读，连接池不宜过大，避免 "database is locked"
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      connection-test-query: SELECT 1

mybatis:
  configuration:
    # 生产环境关闭 SQL 控制台打印
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    # 开启二级缓存与懒加载等生产优化
    cache-enabled: true
    lazy-loading-enabled: true
    aggressive-lazy-loading: false
    local-cache-scope: SESSION
    jdbc-type-for-null: NULL
    default-statement-timeout: 30
    default-fetch-size: 100

logging:
  level:
    com.example.user: warn
    com.example.user.mapper: warn

# 生产环境：AES 密钥必须由环境变量 ENCRYPTION_AES_KEY 注入（无明文回退，缺失则启动失败）
encryption:
  aes-key: ${ENCRYPTION_AES_KEY}

# 生产环境：管理员密码必须由环境变量 DEFAULT_ADMIN_PASSWORD 注入（无明文回退，缺失则启动失败）
default-admin:
  password: ${DEFAULT_ADMIN_PASSWORD}

# 生产环境默认不加载测试数据
test-data:
  enabled: ${TEST_DATA_ENABLED:false}
