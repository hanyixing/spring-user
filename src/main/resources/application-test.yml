# ============================================================
# 测试环境配置（profile: test）
# 使用独立的测试数据库路径，避免污染开发/生产数据
# ============================================================
spring:
  datasource:
    # 测试库路径，可通过环境变量 SQLITE_DB_PATH 覆盖
    url: jdbc:sqlite:${SQLITE_DB_PATH:./data/test.db}

mybatis:
  configuration:
    # 测试环境使用 slf4j 输出，开启缓存以贴近生产行为
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    cache-enabled: true

logging:
  level:
    com.example.user.mapper: info

# AES 密钥：测试环境提供回退值，可通过环境变量 ENCRYPTION_AES_KEY 覆盖
encryption:
  aes-key: ${ENCRYPTION_AES_KEY:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY=}

# 默认管理员密码：测试环境回退值，可通过环境变量 DEFAULT_ADMIN_PASSWORD 覆盖
default-admin:
  password: ${DEFAULT_ADMIN_PASSWORD:Test@123}

# 测试环境默认加载测试数据
test-data:
  enabled: ${TEST_DATA_ENABLED:true}
