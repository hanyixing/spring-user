server:
  port: 10010

spring:
  application:
    name: spring-user
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./data/user.db

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.user.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.example.user.mapper: debug

encryption:
  aes-key: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY=
  key-type: FIXED

default-admin:
  username: admin
  password: admin123
  real-name: 超级管理员
  id-card: 110101199001011234
  phone: 13800138000
  email: admin@example.com
  role: SUPER_ADMIN

test-data:
  enabled: true
