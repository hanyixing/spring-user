server:
  port: 8080

spring:
  application:
    name: spring-user
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/user_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.user.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.example.user.mapper: debug

# 加密配置
encryption:
  # AES密钥（Base64编码，生产环境应从环境变量或配置中心读取）
  aes-key: eW91ci0yNTYtYml0LXNlY3JldC1rZXktaGVyZQ==
  # 密钥生成方式：FIXED-使用固定密钥，RANDOM-每次启动生成随机密钥
  key-type: FIXED
